name: Aplicação - CI/CD

on:
  push:
    branches:
      - main
      - feature-ecommerce

jobs:
  remote-pipeline:
    uses: golden-pipeline/remote-pipeline/.github/workflows/fake-shop-deploy-local.yml@feature-ecommerce  # Chama a Golden Pipeline
    with:
      service_name: "Fake-Shop-Service"
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
      GH_ACCESS_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}